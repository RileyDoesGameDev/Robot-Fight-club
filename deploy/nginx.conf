# Static serving for the Battle Bots build.
#
# The only interesting decisions here are about caching, and they exist because a
# stale `player.js` cost real debugging time during development: the container had
# been rebuilt, the file on disk was correct, and the browser kept serving the old
# one. Somebody handed this image will hit the same thing the first time they are
# sent an update, so the rules below make that impossible rather than merely unlikely.

server {
    listen       8080;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # 9 MB of mostly-compressible JavaScript and JSON. gzip takes player.js from
    # ~4.9 MB to well under a megabyte, which is the difference between a fast first
    # load and a suspicious one. mp3 is already compressed and is excluded.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript text/javascript
                      application/json image/svg+xml;

    # The entry point and the seeded project data must NEVER be cached. They are
    # small, they change on every rebuild, and a stale copy of either produces a game
    # that looks fine and behaves like an older version — the worst failure mode to
    # hand somebody, because it does not look like a caching problem.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }
    location = /seed.js {
        add_header Cache-Control "no-store, must-revalidate" always;
    }
    location = /bundle.json {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # player.js is the engine and changes only when the engine does. It is also the
    # single biggest file, so it is worth caching — but revalidated, not assumed, so
    # an update is picked up on the next load rather than whenever the browser feels
    # like it.
    location = /player.js {
        add_header Cache-Control "no-cache" always;
    }

    # Audio is content-addressed by filename in practice: these files change by being
    # replaced with differently-named ones. Safe to cache hard.
    location /audio/ {
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # The game is a single page; there is nothing to navigate to and nothing to leak.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
